services:
  postgres:
    image: postgres:16-alpine
    container_name: go-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: go_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: go_db
    volumes:
      - go_postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: go-app-prod
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://go_app:${POSTGRES_PASSWORD}@postgres:5432/go_db
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - go_app_uploads:/app/uploads

volumes:
  go_postgres_data:
  go_app_uploads:
