services:
  postgres:
    image: postgres:16-alpine
    container_name: go-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: go_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: go_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - go_postgres_data:/var/lib/postgresql/data

volumes:
  go_postgres_data:
